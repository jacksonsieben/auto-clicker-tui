name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two merges in a row must not race to release; the second waits its turn.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A push to master releases the top version of CHANGELOG.md, unless its tag
  # already exists (a merge labelled "no release" leaves the changelog alone).
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python scripts/changelog.py consistent
          version="$(python scripts/changelog.py version)"
          release=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ] \
             && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, release: $release"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # pynput's Linux metadata wants evdev, which ships source-only. The
          # X11 backend never imports it, so install pynput without its deps.
          pip install --no-deps pynput
          pip install pytest
      - name: Install Xvfb
        # pynput's X11 backend refuses to import without a display, which would
        # skip every test that touches it. A virtual display lets them run.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - run: xvfb-run -a pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: autoclicker-linux
          - os: windows-latest
            target: windows
            artifact: autoclicker-windows
          - os: macos-latest
            target: macos
            artifact: autoclicker-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (Linux)
        if: matrix.target == 'linux'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[build]'
          pip install --no-deps pynput

      - name: Install (Windows/macOS)
        if: matrix.target != 'linux'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build one-file binary
        run: python scripts/build.py

      - name: Build folder fallback (Windows)
        if: matrix.target == 'windows'
        run: python scripts/build.py --onedir

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            ./dist/autoclicker-windows.exe --version
          else
            chmod +x ./dist/${{ matrix.artifact }}
            ./dist/${{ matrix.artifact }} --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/autoclicker-linux
            dist/autoclicker-macos
            dist/autoclicker-windows.exe
            dist/autoclicker-windows-folder.zip
          if-no-files-found: ignore
          # The ready-made binaries are sold on itch.io; keep the CI copies
          # only as long as the release job needs them.
          retention-days: 1

  release:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # Repository secret: an API key from https://itch.io/user/settings/api-keys
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      # Repository variable: the itch.io page, as "user/game"
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/changelog.py notes "$VERSION" > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Creates the tag on this commit. Notes only: the binaries go to itch.io.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.plan.outputs.version }}
          body_path: release-notes.md

      - name: Push to itch.io
        if: env.BUTLER_API_KEY != '' && env.ITCH_TARGET != ''
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          version="$VERSION"
          # One folder per itch.io channel: each becomes its own download.
          mkdir -p ch/windows ch/windows-portable ch/mac ch/linux
          cp artifacts/autoclicker-windows.exe ch/windows/
          cp artifacts/autoclicker-macos ch/mac/
          cp artifacts/autoclicker-linux ch/linux/
          chmod +x ch/mac/* ch/linux/*
          if [ -f artifacts/autoclicker-windows-folder.zip ]; then
            unzip -q artifacts/autoclicker-windows-folder.zip -d ch/windows-portable
          fi
          for channel in windows windows-portable mac linux; do
            if [ -n "$(ls -A "ch/$channel")" ]; then
              butler/butler push "ch/$channel" "$ITCH_TARGET:$channel" --userversion "$version"
            fi
          done
